apiVersion: v1
kind: Service
metadata:
  name: devsecops-platform-service
  namespace: production
  labels:
    app: devsecops-platform
spec:
  type: ClusterIP
  selector:
    app: devsecops-platform
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: devsecops-config
  namespace: production
data:
  DEMO_MODE: "true"
  VAULT_ADDR: "http://vault.security.internal:8200"
  PORT: "8080"
  SPRING_PROFILES_ACTIVE: "prod"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsecops-ingress
  namespace: production
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  tls:
  - hosts:
    - devsecops.enterprise.internal
    secretName: devsecops-tls-cert
  rules:
  - host: devsecops.enterprise.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: devsecops-platform-service
            port:
              number: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: devsecops-network-policy
  namespace: production
spec:
  podSelector:
    matchLabels:
      app: devsecops-platform
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ingress-nginx
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          name: database
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - namespaceSelector:
        matchLabels:
          name: security-tools
    ports:
    - protocol: TCP
      port: 8200
